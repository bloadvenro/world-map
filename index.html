<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#d4e8ea" />
    <meta
      name="description"
      content="Исследуйте карту мира, флаги и русские названия 195 стран."
    />
    <title>Атлас флагов</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <main id="atlas" aria-label="Интерактивная карта мира">
      <canvas
        id="map"
        tabindex="0"
        aria-label="Карта мира. Стрелки перемещают карту, плюс и минус меняют масштаб. Для выбора страны с клавиатуры нажмите Tab."
      ></canvas>
      <select
        id="keyboard-country"
        class="keyboard-only"
        aria-label="Выбрать страну с клавиатуры"
      >
        <option value="">Выберите страну</option>
      </select>
      <div id="view-mode" role="group" aria-label="Вид карты" hidden>
        <button type="button" value="map" aria-label="Карта" title="Карта" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m2.5 5.5 6-2.5 7 2.5 6-2.5v15.5l-6 2.5-7-2.5-6 2.5zM8.5 3v15.5m7-13V21"/>
          </svg>
        </button>
        <button type="button" value="globe" aria-label="Глобус" title="Глобус" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="9.4"/>
            <ellipse cx="12" cy="12" rx="4.2" ry="9.4"/>
            <path d="M2.6 12h18.8M4.5 6.4q7.5 3.5 15 0M4.5 17.6q7.5-3.5 15 0"/>
          </svg>
        </button>
      </div>
      <div id="markers" aria-label="Малые страны"></div>
      <aside id="notice" class="panel" role="status" hidden></aside>
      <section id="nearby" class="panel" aria-label="Страны рядом" hidden>
        <header>
          <b>Страны рядом</b
          ><button id="close-nearby" aria-label="Закрыть">×</button>
        </header>
        <div id="choices"></div>
      </section>
      <section
        id="selection"
        class="panel"
        aria-label="Выбранная страна"
        hidden
      >
        <img id="chosen-flag" alt="" />
        <div class="selection-copy">
          <span>Выбранная страна</span
          ><strong id="chosen-name" aria-live="polite"></strong>
        </div>
        <button id="dismiss" title="Закрыть" aria-label="Закрыть карточку">
          ×
        </button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
